<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="100" y1="10" x2="100" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="100" y1="30" x2="100" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="letterGrad" x1="85" y1="45" x2="115" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer shield glow -->
  <ellipse cx="100" cy="90" rx="62" ry="70" fill="#3b82f6" opacity="0.08"/>

  <!-- Shield outer -->
  <path d="M100 12 L155 35 L155 90 Q155 135 100 158 Q45 135 45 90 L45 35 Z"
        fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Shield inner dark -->
  <path d="M100 20 L148 40 L148 90 Q148 130 100 150 Q52 130 52 90 L52 40 Z"
        fill="url(#innerGrad)"/>

  <!-- Shield rim highlight -->
  <path d="M100 20 L148 40 L148 90 Q148 130 100 150 Q52 130 52 90 L52 40 Z"
        fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>

  <!-- Circuit lines left -->
  <line x1="52" y1="72" x2="30" y2="72" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
  <line x1="30" y1="72" x2="30" y2="58" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
  <circle cx="30" cy="56" r="3" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
  <line x1="30" y1="72" x2="18" y2="72" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
  <circle cx="16" cy="72" r="3" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
  <line x1="30" y1="72" x2="30" y2="86" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
  <circle cx="30" cy="88" r="3" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>

  <!-- Circuit lines right -->
  <line x1="148" y1="72" x2="170" y2="72" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
  <line x1="170" y1="72" x2="170" y2="58" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
  <circle cx="170" cy="56" r="3" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
  <line x1="170" y1="72" x2="182" y2="72" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
  <circle cx="184" cy="72" r="3" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
  <line x1="170" y1="72" x2="170" y2="86" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
  <circle cx="170" cy="88" r="3" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>

  <!-- "A" letterform -->
  <path d="M100 42 L122 118 L113 118 L107 99 L93 99 L87 118 L78 118 Z"
        fill="url(#letterGrad)" filter="url(#glow)"/>
  <!-- A crossbar -->
  <rect x="91" y="91" width="18" height="6" rx="1" fill="url(#letterGrad)"/>
  <!-- A inner cutout -->
  <path d="M100 55 L111 88 L89 88 Z" fill="url(#innerGrad)" opacity="0.9"/>

  <!-- Lock icon centered on A -->
  <rect x="93" y="73" width="14" height="11" rx="2.5" fill="#60a5fa" opacity="0.95"/>
  <path d="M96 73 Q96 67 100 67 Q104 67 104 73" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="78.5" r="2" fill="#0d1117"/>
  <rect x="99" y="79" width="2" height="3" rx="0.5" fill="#0d1117"/>

  <!-- Scan line decoration -->
  <line x1="62" y1="133" x2="138" y2="133" stroke="#3b82f6" stroke-width="0.8" opacity="0.5" stroke-dasharray="4 3"/>

  <!-- AEGIS text -->
  <text x="100" y="175" text-anchor="middle"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-size="22" font-weight="900" letter-spacing="6"
        fill="#e2e8f0" filter="url(#glow)">AEGIS</text>

  <!-- Subtitle -->
  <text x="100" y="190" text-anchor="middle"
        font-family="'Arial', sans-serif"
        font-size="6.5" letter-spacing="2.5"
        fill="#38bdf8" opacity="0.85">AI-POWERED SECURITY ANALYSIS</text>

  <!-- Subtitle side dashes -->
  <line x1="18" y1="188" x2="36" y2="188" stroke="#38bdf8" stroke-width="0.8" opacity="0.6"/>
  <line x1="164" y1="188" x2="182" y2="188" stroke="#38bdf8" stroke-width="0.8" opacity="0.6"/>
</svg>
